[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "last-light-game"
version = "1.0.0"
description = "余灯: an authoritative train rescue game powered by NPC Director v2"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.31,<1", "pydantic>=2.12,<3", "npc-director==0.3.0"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]
build = ["pyinstaller>=6.12,<7", "imageio-ffmpeg==0.6.0"]
art = ["Pillow>=11,<13"]

[tool.hatch.build.targets.wheel]
packages = ["backend/last_light"]

[tool.pytest.ini_options]
pythonpath = ["backend", "../../src"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning"]


[tool.ruff]
target-version = "py311"
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
